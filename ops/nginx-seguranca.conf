# AM Tecnologia · bloco nginx equivalente ao .htaccess (use se a hospedagem for VPS com nginx)
limit_req_zone $binary_remote_addr zone=am_site:10m rate=10r/s;   # dentro de http { }

server {
  listen 80; server_name SEU-DOMINIO.com.br www.SEU-DOMINIO.com.br;
  return 301 https://SEU-DOMINIO.com.br$request_uri;
}
server {
  listen 443 ssl http2; server_name SEU-DOMINIO.com.br;
  ssl_certificate     /etc/letsencrypt/live/SEU-DOMINIO.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/SEU-DOMINIO.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /var/www/am/current; index index.html;
  server_tokens off; client_max_body_size 1k; autoindex off;

  limit_req zone=am_site burst=30 nodelay; limit_req_status 429;
  if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
  location ~ /\.(?!well-known) { deny all; }
  location ~* \.(bak|old|sql|zip|tar|gz|log|env|ini|sh|md|json|yml)$ { deny all; }

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Ywz9cp74FD24NjoRygpyCwcjORfbpbKKPLhVxAXPYEg=' 'sha256-nVrr4En1WmLjqwX2Sycy3XQBr96UWq9pYih+DEl7W0U=' 'sha256-XhjLiXwvWuORjyFCAiSb8D2Hnd+84H5gQRv3VfNj+Iw=' 'sha256-DtI3BlS3/qpSpZlc+aMBhJ3LRygE0VejKttxDBjIw7I=' 'sha256-Nz3UPrzghIfX/2UU9fqN2C3B8+8uK6u/9c0/AfuVpfk='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;

  access_log /var/log/nginx/am_access.log;   # logs de acesso
  error_log  /var/log/nginx/am_error.log warn;
}
